services:
    nginx:
        image: nginx:1.16-alpine
        container_name: nginx-app
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./api:/var/www/api
            - ./client:/var/www/client
            - ./docker/nginx:/etc/nginx/conf.d/
        networks:
            - app_network
        depends_on:
            - api
            - client

    db:
        image: mysql:8.0.31
        container_name: db-app
        restart: unless-stopped
        tty: true
        # ports:
        #     - "3306:3306"   # включай только если реально нужен доступ с хоста
        environment:
            MYSQL_DATABASE: db
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_PASSWORD: secret
            MYSQL_USER: user
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - ./docker/mysql/db_data:/var/lib/mysql
            - ./docker/mysql:/etc/mysql/conf.d
        networks:
            - app_network

    api:
        build:
            args:
                user: ubuntu
                uid: 1000
            context: ./docker/php
            dockerfile: Dockerfile
        tty: true
        container_name: api-app
        restart: unless-stopped
        working_dir: /var/www/api
        volumes:
            - ./api:/var/www/api
        networks:
            - app_network
        depends_on:
            - db

    phpmyadmin:
        image: phpmyadmin
        restart: always
        depends_on:
            - db
        ports:
            - "8783:80"
        environment:
            - PMA_ARBITRARY=1
        networks:
            - app_network

    client:
        image: node:18-alpine
        container_name: client-app
        tty: true
        volumes:
            - ./client:/client
        working_dir: /client
        tmpfs:
            - /tmp
        environment:
            NODE_ENV: development
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - app_network
        depends_on:
            - api
        ports:
            - "3000:3000"
            - "24678:24678"

networks:
    app_network:
        driver: bridge
