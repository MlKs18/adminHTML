# map должен быть в http-контексте, в конфиге сайта он тоже работает,
# но если nginx ругается — вынесите его в /etc/nginx/conf.d/websocket.conf
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 32m;

    # ---------------------------------------------------------------
    # Laravel API (PHP-FPM)
    # ---------------------------------------------------------------

    # Статика/роуты Laravel, которые отдаются напрямую из public
    location ~ ^/(api|sanctum|vendor|docs|storage|_debugbar|build|verify|sitemap\.xml|clear) {
        root /var/www/api/public;
        try_files $uri /index.php$is_args$args;
    }

    # Файлы из storage (симлинк на public/storage)
    location ~ ^/storage {
        root /var/www/api;
        try_files $uri =404;
    }

    # Входная точка Laravel
    location ~ ^/index\.php(/|$) {
        root /var/www/api/public;
        try_files $uri =404;
        fastcgi_pass api-app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # ---------------------------------------------------------------
    # Vite dev-server (Vue) — порт 5173
    # ---------------------------------------------------------------
    location / {
        proxy_pass http://client-app:5173;

        proxy_http_version 1.1;

        # WebSocket для HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Стандартные заголовки
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite dev-server не любит буферизацию (SSE, HMR)
        proxy_buffering off;
        proxy_read_timeout 86400;

        proxy_redirect off;
    }
}
